<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Our Team</h1>

    <section class="profile-container">

        <!-- Profile Card 1 -->
        <div class="profile-card">
            <img src="https://i.pravatar.cc/300?img=47" 
                 alt="Ananya Sharma">

            <h2 id="ananya">Ananya Sharma</h2>

            <h3 class="role">Frontend Developer</h3>

            <p>Creates clean and responsive websites for users.</p>
        </div>


        <!-- Profile Card 2 -->
        <div class="profile-card">
            <img src="https://i.pravatar.cc/300?img=12" 
                 alt="Rahul Verma">

            <h2 id="rahul">Rahul Verma</h2>

            <h3 class="role">Backend Developer</h3>

            <p>Builds reliable APIs and powerful backend systems.</p>
        </div>


        <!-- Profile Card 3 -->
        <div class="profile-card">
            <img src="https://i.pravatar.cc/300?img=32" 
                 alt="Priya Singh">

            <h2 id="priya">Priya Singh</h2>

            <h3 class="role">UI/UX Designer</h3>

            <p>Designs simple and beautiful user experiences.</p>
        </div>

    </section>

</body>
</html>
